<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Job Matcher - CV and Job Description Matching Tool</title>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- Left document (CV) -->
  <rect x="8" y="8" width="6" height="8" rx="1" fill="#3b82f6" stroke="#1d4ed8" stroke-width="0.5"/>
  <line x1="9" y1="10" x2="12" y2="10" stroke="#ffffff" stroke-width="0.5"/>
  <line x1="9" y1="12" x2="13" y2="12" stroke="#ffffff" stroke-width="0.5"/>
  <line x1="9" y1="14" x2="11" y2="14" stroke="#ffffff" stroke-width="0.5"/>

  <!-- Right document (Job Description) -->
  <rect x="18" y="8" width="6" height="8" rx="1" fill="#10b981" stroke="#059669" stroke-width="0.5"/>
  <line x1="19" y1="10" x2="22" y2="10" stroke="#ffffff" stroke-width="0.5"/>
  <line x1="19" y1="12" x2="23" y2="12" stroke="#ffffff" stroke-width="0.5"/>
  <line x1="19" y1="14" x2="21" y2="14" stroke="#ffffff" stroke-width="0.5"/>

  <!-- Matching connection lines -->
  <line x1="14" y1="12" x2="18" y2="12" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="14" cy="12" r="1" fill="#fbbf24"/>
  <circle cx="18" cy="12" r="1" fill="#fbbf24"/>

  <!-- Match percentage indicator -->
  <circle cx="16" cy="22" r="3" fill="#22c55e" stroke="#ffffff" stroke-width="0.5"/>
  <text x="16" y="23.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="3" font-weight="bold" fill="#ffffff">95</text>
</svg>
