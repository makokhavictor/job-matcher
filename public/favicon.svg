<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Job Matcher</title>
  <defs>
    <!-- Clip left circle shape to extract intersection -->
    <clipPath id="lc">
      <circle cx="12" cy="16" r="7.5"/>
    </clipPath>
    <!-- Subtle glow for center spark -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Warm near-black background, slightly rounded square -->
  <rect width="32" height="32" rx="7" fill="#1a1612"/>

  <!-- Left circle (CV) — warm amber -->
  <circle cx="12" cy="16" r="7.5" fill="#7D5C3A" opacity="0.95"/>

  <!-- Right circle (Job) — warm amber -->
  <circle cx="20" cy="16" r="7.5" fill="#7D5C3A" opacity="0.95"/>

  <!-- Intersection lens — brighter warm gold, clipped to left circle -->
  <circle cx="20" cy="16" r="7.5" fill="#C49A52" clip-path="url(#lc)"/>

  <!-- Center match spark — luminous cream white -->
  <circle cx="16" cy="16" r="2" fill="#FAF0E0" filter="url(#glow)" opacity="0.95"/>
</svg>
