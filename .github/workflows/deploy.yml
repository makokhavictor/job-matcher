name: Deploy Job Matcher

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ github.repository }}
      REGISTRY: ghcr.io
      NEXT_PUBLIC_BACKEND_API_URL: ${{ github.ref == 'refs/heads/main' && secrets.NEXT_PUBLIC_BACKEND_API_PROD_URL || secrets.NEXT_PUBLIC_BACKEND_API_URL }}
      NEXT_PUBLIC_BACKEND_API_KEY: ${{ secrets.NEXT_PUBLIC_BACKEND_API_KEY }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine environment
        id: determine_env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "KUSTOMIZE_OVERLAY=production" >> $GITHUB_OUTPUT
            echo "NAMESPACE=prod" >> $GITHUB_OUTPUT
            echo "DEPLOYMENT_NAME=jobmatcher-prod" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=latest" >> $GITHUB_OUTPUT
            echo "NEXT_PUBLIC_BASE_PATH=" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "KUSTOMIZE_OVERLAY=test" >> $GITHUB_OUTPUT
            echo "NAMESPACE=test" >> $GITHUB_OUTPUT
            echo "DEPLOYMENT_NAME=jobmatcher-test" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=test" >> $GITHUB_OUTPUT
            echo "NEXT_PUBLIC_BASE_PATH=/jobmatcher" >> $GITHUB_OUTPUT
          else
            echo "Skipping deployment for branch ${{ github.ref }}"
            exit 0
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.determine_env.outputs.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_BASE_PATH=${{ steps.determine_env.outputs.NEXT_PUBLIC_BASE_PATH }}
            NEXT_PUBLIC_BACKEND_API_URL=${{ github.ref == 'refs/heads/main' && secrets.NEXT_PUBLIC_BACKEND_API_PROD_URL || secrets.NEXT_PUBLIC_BACKEND_API_URL }}
            NEXT_PUBLIC_BACKEND_API_KEY=${{ secrets.NEXT_PUBLIC_BACKEND_API_KEY }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

      - name: Copy k8s directory to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: k8s/
          target: ~/jobmatcher-deployments/frontend

      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            NAMESPACE="${{ steps.determine_env.outputs.NAMESPACE }}"
            KUSTOMIZE_OVERLAY="${{ steps.determine_env.outputs.KUSTOMIZE_OVERLAY }}"
            DEPLOYMENT_NAME="${{ steps.determine_env.outputs.DEPLOYMENT_NAME }}"

            echo "Checking for namespace $NAMESPACE..."
            if ! kubectl get namespace $NAMESPACE &> /dev/null; then
              echo "Namespace $NAMESPACE not found. Creating..."
              kubectl create namespace $NAMESPACE
            else
              echo "Namespace $NAMESPACE already exists."
            fi

            cd ~/jobmatcher-deployments/frontend/k8s/overlays/$KUSTOMIZE_OVERLAY
            echo "Applying Kustomize configuration for $KUSTOMIZE_OVERLAY..."
            kustomize build . | kubectl apply -f -
            echo "Restarting deployment to pull latest image..."
            kubectl rollout restart deployment/$DEPLOYMENT_NAME -n $NAMESPACE
