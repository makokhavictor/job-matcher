name: Build and Push Image

on:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_BACKEND_API_URL=${{ github.ref == 'refs/heads/main' && secrets.NEXT_PUBLIC_BACKEND_API_PROD_URL || secrets.NEXT_PUBLIC_BACKEND_API_URL }}
            NEXT_PUBLIC_BACKEND_API_KEY=${{ secrets.NEXT_PUBLIC_BACKEND_API_KEY }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

      - name: Trigger Dokploy deployment
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            DEPLOY_URL="${{ secrets.DOKPLOY_DEPLOY_URL_PROD }}"
          else
            DEPLOY_URL="${{ secrets.DOKPLOY_DEPLOY_URL_STAGING }}"
          fi
          curl -s -X GET "$DEPLOY_URL" || true
